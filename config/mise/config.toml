[tools]
# -- ( languages ) ------------------------------------------------------------
erlang = "latest"
elixir = "latest"
java = "temurin"
clojure = "latest"
go = "latest"
tinygo = "latest"
zig = "latest"
node = "latest"
python = "latest"
uv = "latest"

# -- ( editor ) ---------------------------------------------------------------
neovim = "latest"
tree-sitter = "latest"
clj-kondo = "latest"

# -- ( shell and terminal ) ---------------------------------------------------
"github:tmux/tmux-builds" = "latest"
fzf = "latest"
direnv = "latest"
bat = "latest"
rg = "latest"
jq = "latest"
lazygit = "latest"
shellcheck = "latest"
shfmt = "latest"
usage = "latest"

# -- ( infra ) ----------------------------------------------------------------
terraform = "latest"
ansible = "latest"

# -- ( secrets ) --------------------------------------------------------------
age = "latest"
fnox = "latest"

# -- ( agents ) ---------------------------------------------------------------
pi = "latest"

# -- ( system packages ) ------------------------------------------------------
[bootstrap.packages]
# fedora
"dnf:git" = "latest"
"dnf:zsh" = "latest"
"dnf:curl" = "latest"
"dnf:unzip" = "latest"
"dnf:tar" = "latest"
"dnf:xz" = "latest"
"dnf:make" = "latest"
"dnf:gcc" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:tree" = "latest"
"dnf:rlwrap" = "latest"
"dnf:util-linux" = "latest"
"dnf:brave-origin" = "latest"
"dnf:1password" = { os = "linux/x64" }

# erlang build deps
"dnf:autoconf" = "latest"
"dnf:perl" = "latest"
"dnf:ncurses-devel" = "latest"
"dnf:openssl-devel" = "latest"

# macos
"brew:tree" = { os = "macos" }
"brew:rlwrap" = { os = "macos" }

# AeroSpace installs in the post-packages hook: its cask is only in nikitabobko/tap
"brew-cask:ghostty" = { os = "macos", adopt = true }
"brew-cask:karabiner-elements" = { os = "macos", adopt = true }

[bootstrap.hooks]
pre-packages = [
  # macos: check for xcode cli
  '[ "$(uname -s)" != Darwin ] || xcode-select -p >/dev/null 2>&1 || xcode-select --install',
  # fedroa: add brave-origin, and 1password repos to dnf
  '''
  [ -r /etc/os-release ] && . /etc/os-release
  [ "${ID:-}" = fedora ] || exit 0
  if [ ! -f /etc/yum.repos.d/brave-browser.repo ]; then
    sudo curl -fsSLo /etc/yum.repos.d/brave-browser.repo \
      https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
  fi
  if [ ! -f /etc/yum.repos.d/1password.repo ]; then
    sudo rpm --import https://downloads.1password.com/linux/keys/1password.asc
    printf '%s\n' \
      '[1password]' \
      'name=1Password Stable Channel' \
      'baseurl=https://downloads.1password.com/linux/rpm/stable/$basearch' \
      'enabled=1' \
      'gpgcheck=1' \
      'repo_gpgcheck=1' \
      'gpgkey=https://downloads.1password.com/linux/keys/1password.asc' \
      | sudo tee /etc/yum.repos.d/1password.repo >/dev/null
  fi
  ''',
]
post-packages = '[ "$(uname -s)" != Darwin ] || brew install --cask nikitabobko/tap/aerospace'

# /bin/zsh exists on macOS and on Fedora (/bin -> /usr/bin)
[bootstrap.user]
login_shell = "/bin/zsh"
